name: Monitor FRB Services
on:
  workflow_dispatch:
  schedule:
    # Every 10th and 40th minute - https://crontab.guru/#10,40_*_*_*_*
    - cron: '10,40 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    name: Run frbservices CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: stable
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run
      run: go run .
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
